<aside class="library-sidebar screen-only" aria-label="Library sidebar">
  <a class="brand" routerLink="/" aria-label="nuancedTheology home"><span class="brand-mark" aria-hidden="true">✝</span><span>nuanced<span class="brand-serif">Theology</span></span></a>
  <p class="sidebar-tagline">A Catholic learning library</p>

</aside>
<header class="mobile-header screen-only">
  <a class="brand" routerLink="/" aria-label="nuancedTheology home"><span class="brand-mark" aria-hidden="true">✝</span><span>nuanced<span class="brand-serif">Theology</span></span></a>
  <button #menuButton type="button" class="menu-button" aria-controls="library-drawer" [attr.aria-expanded]="drawerOpen()" aria-label="Open library navigation" (click)="openDrawer()"><span aria-hidden="true">☰</span> Library</button>
</header>
<dialog #drawer id="library-drawer" class="library-drawer screen-only" aria-labelledby="drawer-title" (close)="drawerOpen.set(false)" (click)="closeOnBackdrop($event)">
  <div class="drawer-heading"><h2 id="drawer-title">Learning library</h2><button type="button" class="drawer-close" aria-label="Close library navigation" (click)="closeDrawer()">✕</button></div>
  <nt-library-nav (navigate)="closeDrawer()"/>
</dialog>
<div class="site-frame">
  <main id="main" tabindex="-1"><router-outlet/></main>
  <footer class="site-footer"><a class="brand" routerLink="/">nuanced<span class="brand-serif">Theology</span></a><p>Faithful explanations. Shared freely.</p><span>Scripture · Catechism · Everyday life</span></footer>
</div>
